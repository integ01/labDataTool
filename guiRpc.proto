syntax = "proto3";

option java_multiple_files = true;
option java_package = "io.grpc.labDataTool.guiRpc";
option java_outer_classname = "GuiRpcProto";
option objc_class_prefix = "HLW";

package guiRpc;


service GuiRpc {

  //rpc getDataPlot( optionQuery) returns (stream SampleArray) {}

  rpc startSample(ExperimentSetup) returns (stream SampleArray) {}

 // rpc labCmd(LabCommand) returns (STATUS) {}
}

message ByteBlock { 
  int32 data_length = 2;
  bytes data_bytes =1;
};

message STATUS {
  string ret = 1;
}



message SampleArray {

enum SParamType {
    S11 = 0;
    S21 = 1;
    S12 = 2;
    S22 = 3;
}
  SParamType Sparam = 1;
  //int32 data_length = 2;
  //bytes data_bytes =3;
  ByteBlock data = 2;
  ByteBlock ff = 3;
//  StreamBytes data = 5;

}


message ExperimentSetup {
  string operator = 1;
  string date = 2;
  float freqLow = 3;
  float freqHigh = 4;
//  SParamType Sparam = 5;
  //repeated Material material = 5;
  
}  





